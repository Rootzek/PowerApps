name: capture-dev-changes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Dev environment key (format: dev_<slug>, e.g. dev_user1, dev_user3). Requires matching DEV_<SLUG>_ENV_URL / DEV_<SLUG>_ENV_ID variables and a GitHub Environment of the same name.'
        required: true
        type: string
      branch_suffix:
        description: 'Suffix for the branch name. Final branch will be <environment>/<branch_suffix>'
        required: true
        type: string
      solutions:
        description: 'Comma-separated solution names to export (e.g. MainSolution,SurveysSolution)'
        required: true
        type: string
      commit_message:
        description: 'Optional custom commit message. If empty a default message will be used.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Build solution matrix
        id: build
        shell: bash
        run: |
          MATRIX_JSON=$(jq -n --arg solutions "${{ inputs.solutions }}" -c '{include: ($solutions | split(",") | map(gsub("^\\s+|\\s+$";"") | {name: .}))}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  export-and-unpack:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: capture-${{ inputs.environment }}-${{ inputs.branch_suffix }}
      cancel-in-progress: false

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve dev environment prefix
        id: env-prefix
        uses: ./.github/actions/resolve-dev-environment
        with:
          environment: ${{ inputs.environment }}

      - name: Set environment variables
        id: set-env
        shell: bash
        env:
          ENV_URL: ${{ vars[format('{0}_ENV_URL', steps.env-prefix.outputs.prefix)] }}
          ENV_ID: ${{ vars[format('{0}_ENV_ID', steps.env-prefix.outputs.prefix)] }}
        run: |
          if [ -z "$ENV_URL" ] || [ -z "$ENV_ID" ]; then
            echo "::error::Missing repository/environment variables for dev environment '${{ inputs.environment }}'. Expected '${{ steps.env-prefix.outputs.prefix }}_ENV_URL' and '${{ steps.env-prefix.outputs.prefix }}_ENV_ID' to be defined."
            exit 1
          fi
          echo "env_url=$ENV_URL" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare branch for validation
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Clean any uncommitted changes to ensure clean working directory.
          git reset --hard HEAD
          git clean -fd

          git fetch --prune origin

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q .; then
            echo "Branch '$BRANCH_NAME' already exists. Checking out and updating."
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            echo "::error::Branch '$BRANCH_NAME' does not exist. Prepare the environment from main before capturing changes."
            {
              echo "## ❌ Capture blocked"
              echo ""
              echo "Branch **$BRANCH_NAME** does not exist yet."
              echo "Run **prepare-dev-environment** first so the environment and branch share the same Git baseline before any maker changes are captured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Block stale environment capture
        shell: bash
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          BASE_SHA=$(git merge-base HEAD origin/main)

          if [ -z "$BASE_SHA" ]; then
            echo "::error::Unable to determine merge-base between '$BRANCH_NAME' and origin/main."
            exit 1
          fi

          if git diff --quiet "$BASE_SHA" origin/main -- "solutions/${{ matrix.name }}/src"; then
            echo "No newer main changes detected for solutions/${{ matrix.name }}/src since $BASE_SHA"
            exit 0
          fi

          echo "::error::Capture blocked for '${{ matrix.name }}': main changed after branch '$BRANCH_NAME' diverged. Refresh the dev environment from the latest branch baseline before exporting."
          {
            echo "## ❌ Capture blocked"
            echo ""
            echo "Solution **${{ matrix.name }}** changed on **main** after branch **$BRANCH_NAME** diverged from commit **$BASE_SHA**."
            echo "Exporting from this environment could overwrite changes already merged to main."
            echo ""
            echo "Required action:"
            echo "1. If the environment contains maker work that is not captured elsewhere, run **backup-dev-changes** first for **${{ inputs.environment }}** and **${{ matrix.name }}**."
            echo "2. Rebase or merge the branch with the latest **main** locally."
            echo "3. Run **prepare-dev-environment** again for **${{ inputs.environment }}**."
            echo "4. Re-apply or re-validate maker changes in the refreshed environment."
            echo "5. Run **capture-dev-changes** again."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export ${{ matrix.name }} unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}.zip
          managed: false

      - name: Export ${{ matrix.name }} managed solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}_managed.zip
          managed: true

      - name: Authenticate to Power Platform for solution check
        shell: bash
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" auth create \
            --environment "${{ steps.set-env.outputs.env_url }}" \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Validate solution health
        shell: bash
        run: |
          chmod +x .github/scripts/check-solution-health.sh
          .github/scripts/check-solution-health.sh "out/${{ matrix.name }}.zip" "${{ matrix.name }}"

      - name: Upload solution checker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solution-checker-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}_checker_results.zip
            out/${{ matrix.name }}_checker_results/**

      - name: Prepare branch for rebase
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Clean any uncommitted changes to ensure clean working directory
          git reset --hard HEAD
          git clean -fd
          
          git fetch --prune origin

          # Checkout existing branch or create new one.
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q .; then
            echo "Branch '$BRANCH_NAME' already exists. Checking out and updating."
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            echo "Creating new branch '$BRANCH_NAME'."
            git checkout -B "$BRANCH_NAME"
          fi

      - name: Rebase on main
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"

          # Working tree is guaranteed clean at this point (reset --hard + clean -fd
          # in the previous step, nothing staged since), so the rebase can proceed
          # without the "you have uncommitted changes" error.
          if git ls-remote --heads origin main | grep -q .; then
            if ! git rebase origin/main; then
              git rebase --abort

              echo "::error::Rebase of '$BRANCH_NAME' onto origin/main hit conflicts and was aborted. Resolve locally and push manually."
              {
                echo "## ❌ Rebase conflict"
                echo ""
                echo "Branch **$BRANCH_NAME** could not be automatically rebased onto **main**."
                echo "Resolve it locally, then push the result so this workflow can pick it up on the next run:"
                echo ""
                echo '```bash'
                echo "git fetch origin"
                echo "git checkout $BRANCH_NAME"
                echo "git rebase origin/main"
                echo "# fix conflicts in the affected files, then:"
                echo "git add ."
                echo "git rebase --continue"
                echo "git push --force-with-lease origin $BRANCH_NAME"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

              exit 1
            fi
          fi

          echo "✅ Rebase successful"

      - name: Clean ${{ matrix.name }} solution folder
        run: |
          # Remove the previously committed unpack before re-unpacking, so files
          # deleted/renamed in the export don't linger. Done after the rebase so
          # the rebase always starts from a clean working tree.
          echo "Cleaning solutions/${{ matrix.name }}/src..."
          rm -rf "solutions/${{ matrix.name }}/src"

      - name: Unpack ${{ matrix.name }} solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ matrix.name }}.zip
          solution-folder: solutions/${{ matrix.name }}/src
          solution-type: Both
          overwrite-files: true

      - name: Commit unpacked solution
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "solutions/${{ matrix.name }}/src"
          git commit -m "${{ inputs.commit_message || 'chore: sync ${{ matrix.name }} (managed + unmanaged) from ${{ steps.set-env.outputs.env_url }}' }}" || echo "No changes to commit"

          # --force-with-lease is required because the rebase step rewrites
          # this branch's history relative to whatever was previously pushed.
          git push --force-with-lease -u origin "$BRANCH_NAME"

      - name: Summary
        shell: bash
        run: |
          BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          echo "## Capture Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Solutions:** ${{ inputs.solutions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment ID:** ${{ steps.set-env.outputs.env_id }}" >> $GITHUB_STEP_SUMMARY