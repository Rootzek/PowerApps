name: capture-dev-changes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Dev environment to capture from'
        required: true
        type: choice
        options:
          - dev_user1
          - dev_user2
      branch_suffix:
        description: 'Suffix for the branch name. Final branch will be <environment>/<branch_suffix>'
        required: true
        type: string
      solutions:
        description: 'Comma-separated solution names to export (e.g. MainSolution,SurveysSolution)'
        required: true
        type: string
      commit_message:
        description: 'Optional custom commit message. If empty a default message will be used.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Build solution matrix
        id: build
        shell: bash
        run: |
          MATRIX_JSON=$(jq -n --arg solutions "${{ inputs.solutions }}" -c '{include: ($solutions | split(",") | map(gsub("^\\s+|\\s+$";"") | {name: .}))}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  export-and-unpack:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set environment variables
        id: set-env
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "dev_user1" ]; then
            ENV_URL="${{ vars.DEV_USER1_ENV_URL }}"
            ENV_ID="${{ vars.DEV_USER1_ENV_ID }}"
          else
            ENV_URL="${{ vars.DEV_USER2_ENV_URL }}"
            ENV_ID="${{ vars.DEV_USER2_ENV_ID }}"
          fi
          echo "env_url=$ENV_URL" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export ${{ matrix.name }} unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}.zip
          managed: false

      - name: Export ${{ matrix.name }} managed solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}_managed.zip
          managed: true

      - name: Unpack ${{ matrix.name }} solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ matrix.name }}.zip
          solution-folder: solutions/${{ matrix.name }}/src
          solution-type: Both
          overwrite-files: true

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: solutions-unpacked-${{ matrix.name }}
          path: solutions/${{ matrix.name }}/src
          if-no-files-found: error

  commit-and-push:
    needs: export-and-unpack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all solution artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifact-downloads

      - name: Restore all solutions to repository
        shell: bash
        run: |
          echo "Listing artifact-downloads:" && ls -la artifact-downloads || true
          for dir in artifact-downloads/*; do
            [ -d "$dir" ] || continue
            NAME=$(basename "$dir")
            NAME=${NAME#solutions-unpacked-}
            echo "Processing artifact dir: $dir (solution name: $NAME)"

            # If the artifact contains a top-level 'solutions' folder, sync its contents into solutions/
            if [ -d "$dir/solutions" ]; then
              echo "Found nested 'solutions' folder; syncing its contents into solutions/"
              rsync -a "$dir/solutions/" solutions/ || cp -R "$dir/solutions/." solutions/

            # If the artifact contains a root 'src' folder, treat it as solution source and copy into solutions/<name>/src
            elif [ -d "$dir/src" ]; then
              echo "Found 'src' folder in artifact; copying into solutions/$NAME/src"
              mkdir -p "solutions/$NAME/src"
              rsync -a "$dir/src/" "solutions/$NAME/src/" || cp -R "$dir/src/." "solutions/$NAME/src/"

            # If the artifact root looks like solution XML source, copy it into solutions/<name>/src
            elif [ -d "$dir/Other" ] || [ -d "$dir/AppModules" ] || [ -d "$dir/AppModuleSiteMaps" ] || [ -d "$dir/Entities" ]; then
              echo "Found solution source root; copying artifact root into solutions/$NAME/src"
              mkdir -p "solutions/$NAME/src"
              rsync -a "$dir/" "solutions/$NAME/src/" || cp -R "$dir/." "solutions/$NAME/src/"

            else
              echo "No nested 'solutions', 'src', or solution source root detected; copying artifact root into solutions/"
              rsync -a "$dir/" solutions/ || cp -R "$dir/." solutions/
            fi
          done

          # Post-restore: show any new or changed files under solutions compared to HEAD
          echo "Comparing solutions/ to HEAD (showing created/modified files):"
          git fetch --no-tags --prune origin || true
          git ls-files --others --exclude-standard --directory | sed -n '1,200p' || true
          git --no-pager status --porcelain=2 --untracked-files=all | sed -n '1,200p' || true

      - name: Set environment variables
        id: set-env
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "dev_user1" ]; then
            ENV_ID="${{ vars.DEV_USER1_ENV_ID }}"
          else
            ENV_ID="${{ vars.DEV_USER2_ENV_ID }}"
          fi
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        shell: bash
        run: |
          BRANCH="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch --prune origin

          # Checkout existing branch or create new one
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Branch '$BRANCH' already exists. Checking out and pulling latest."
            git checkout --track "origin/$BRANCH"
            git pull origin "$BRANCH"
          else
            echo "Creating new branch '$BRANCH'."
            git checkout -b "$BRANCH"
          fi

          # Diagnostics: show current branch, recent commits, and workspace status
          echo "Current branch:" $(git rev-parse --abbrev-ref HEAD)
          echo "Recent commits:" && git --no-pager log -n 5 --oneline || true
          echo "Listing solutions directory:" && ls -la solutions || true
          echo "Find some files under solutions (first 200):" && find solutions -type f | sed -n '1,200p' || true
          echo "Git status (porcelain):" && git status --porcelain --untracked-files=all || true
          echo "Untracked files (git ls-files --others --exclude-standard):" && git ls-files --others --exclude-standard || true
          echo "Ignored files (git ls-files --ignored --exclude-standard):" && git ls-files --ignored --exclude-standard || true

          # Stage all changes (including deletions) under solutions
          git add -A solutions/ || true

          if git diff --staged --quiet; then
            echo "No changes detected after export. Nothing to commit."
          else
            COMMIT_MSG="${{ inputs.commit_message }}"
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="Bring changes from ${{ inputs.environment }} for: ${{ inputs.solutions }}"
            fi
            git commit -m "$COMMIT_MSG"
            git push --set-upstream origin "$BRANCH"
            echo "Pushed branch: $BRANCH"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          BRANCH="${{ inputs.environment }}/${{ inputs.branch_suffix }}"
          echo "## Capture Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Solutions:** ${{ inputs.solutions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment ID:** ${{ steps.set-env.outputs.env_id }}" >> $GITHUB_STEP_SUMMARY