name: deploy-to-qa

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Nom de la solution à déployer vers QA"
        required: true
        default: "MainSolution"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack ${{ inputs.solution_name }} as managed
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ inputs.solution_name }}/src
          solution-file: out/${{ inputs.solution_name }}_managed.zip
          solution-type: Managed

      - name: Import to QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ inputs.solution_name }}_managed.zip
          force-overwrite: true
          publish-changes: true