name: single-run-promotion

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      solutions:
        description: 'Comma-separated solution names to promote. Leave empty to use change detection.'
        required: false
        type: string
      force_all:
        description: 'Promote all solutions from the release manifest.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      any_changed: ${{ steps.manifest.outputs.any_changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install yq + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install yq

      - name: Read and sort release manifest
        id: manifest
        shell: bash
        run: |
          FILE="manifests/releases/current.yml"
          MATRIX_JSON=$(yq '.solutions' "$FILE" | jq -c '{include: sort_by(.order)}')

          REQUESTED_SOLUTIONS="${{ inputs.solutions }}"
          FORCE_ALL="${{ inputs.force_all }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$REQUESTED_SOLUTIONS" ]; then
            FILTERED_MATRIX=$(jq -cn '{include: []}')
            ANY_CHANGED=false
            MISSING_SOLUTIONS=()

            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue

              MATCH=$(jq -c --arg name "$NAME" '.include[] | select(.name == $name)' <<< "$MATRIX_JSON")
              if [ -n "$MATCH" ]; then
                FILTERED_MATRIX=$(jq -c --argjson item "$MATCH" '.include += [$item]' <<< "$FILTERED_MATRIX")
                ANY_CHANGED=true
              else
                MISSING_SOLUTIONS+=("$NAME")
              fi
            done < <(printf '%s' "$REQUESTED_SOLUTIONS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | awk 'NF' | sort -u)

            if [ ${#MISSING_SOLUTIONS[@]} -gt 0 ]; then
              echo "Unknown solution(s) requested: ${MISSING_SOLUTIONS[*]}" >&2
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_ALL" = "true" ]; then
            FILTERED_MATRIX="$MATRIX_JSON"
            ANY_CHANGED=true

          else
            FILTERED_MATRIX='{"include": []}'
            ANY_CHANGED=false

            while IFS=$'\n' read -r item; do
              NAME=$(echo "$item" | jq -r '.name')
              ORDER=$(echo "$item" | jq -r '.order')
              
              if ! git diff --quiet HEAD~1 HEAD -- "solutions/$NAME/src"; then
                FILTERED_MATRIX=$(jq -c --arg name "$NAME" --argjson order "$ORDER" '.include += [{name: $name, order: $order}]' <<< "$FILTERED_MATRIX")
                ANY_CHANGED=true
              fi
            done < <(jq -c '.include[]' <<< "$MATRIX_JSON")
          fi

          echo "matrix=$FILTERED_MATRIX" >> "$GITHUB_OUTPUT"
          echo "any_changed=$ANY_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$FILTERED_MATRIX"
          echo "Any changed solutions: $ANY_CHANGED"

  generate-version:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release version
        id: version
        shell: bash
        run: |
          YEAR=$(date +'%Y')
          DAY_OF_YEAR=$(date +'%j')

          echo "Year: $YEAR"
          echo "Day of year: $DAY_OF_YEAR"

          # Remove leading zeros (001 → 1)
          DAY_OF_YEAR=$((10#$DAY_OF_YEAR))

          # Get today's releases
          TAG_PREFIX="v$YEAR.$DAY_OF_YEAR."

          TAGS=$(git tag | grep "^$TAG_PREFIX" || true)

          if [ -z "$TAGS" ]; then
            RELEASE=1
          else
            MAX=$(echo "$TAGS" | sed -E "s/v$YEAR\.$DAY_OF_YEAR\.([0-9]+)\..*/\1/" | sort -n | tail -n 1)
            RELEASE=$((MAX + 1))
          fi

          HOTFIX=0

          VERSION="$YEAR.$DAY_OF_YEAR.$RELEASE.$HOTFIX"

          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-artifacts:
    needs:
      - build-matrix
      - generate-version
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Detect changes for ${{ matrix.name }}
        id: detect_changes
        shell: bash
        run: |
          echo "Checking changes for solution: ${{ matrix.name }}"

          if git diff --quiet origin/main HEAD -- solutions/${{ matrix.name }}/src; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate folder exists
        shell: bash
        run: |
          test -d "solutions/${{ matrix.name }}/src" || {
            echo "Folder not found: solutions/${{ matrix.name }}/src"
            exit 1
          }

      - name: Set full solution version
        shell: bash
        run: |
          VERSION="${{ needs.generate-version.outputs.version }}"

          echo "Setting solution version to $VERSION"

          sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" solutions/${{ matrix.name }}/src/Other/Solution.xml

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack ${{ matrix.name }} as unmanaged for validation
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}.zip
          solution-type: Unmanaged

      - name: Pack ${{ matrix.name }} as managed
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          solution-type: Managed

      - name: Authenticate to Power Platform for solution check
        shell: bash
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" auth create \
            --environment "${{ vars.DEV_ENV_URL }}" \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Validate solution health
        shell: bash
        run: |
          chmod +x .github/scripts/check-solution-health.sh
          .github/scripts/check-solution-health.sh "out/${{ matrix.name }}.zip" "${{ matrix.name }}"

      - name: Upload solution checker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solution-checker-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: |
            out/${{ matrix.name }}_checker_results.zip
            out/${{ matrix.name }}_checker_results/**

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          if-no-files-found: error

  create-release-tag:
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    needs:
      - build-matrix
      - generate-version
      - build-artifacts
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push Git tag if missing
        id: tag
        shell: bash
        run: |
          TAG="${{ needs.generate-version.outputs.version }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi

          if git ls-remote --tags origin "refs/tags/$TAG" | grep "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub release if missing
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.generate-version.outputs.version }}
          name: Release v${{ needs.generate-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-dev:
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    needs:
      - build-matrix
      - generate-version
      - build-artifacts
      - create-release-tag
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: out

      - name: Prepare deployment settings for ${{ matrix.name }}
        id: settings
        shell: bash
        run: |
          FILE="solutions/${{ matrix.name }}/env-settings/dev.json"
          if [ -f "$FILE" ]; then
            # Inject GitHub secrets and variables into the settings file.
            # Add one export line per placeholder (${PLACEHOLDER}) used in the file.
            # Example: export MY_API_KEY="${{ secrets.MY_API_KEY }}"
            # Example: export MY_SERVICE_URL="${{ vars.MY_SERVICE_URL }}"
            envsubst < "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
            echo "has_settings=true" >> "$GITHUB_OUTPUT"
            echo "settings_file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_settings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import ${{ matrix.name }} to DEV
        if: steps.settings.outputs.has_settings == 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true
          deployment-settings-file: ${{ steps.settings.outputs.settings_file }}

      - name: Import ${{ matrix.name }} to DEV
        if: steps.settings.outputs.has_settings != 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-qa:
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    needs:
      - build-matrix
      - generate-version
      - build-artifacts
      - create-release-tag
      - deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: out

      - name: Prepare deployment settings for ${{ matrix.name }}
        id: settings
        shell: bash
        run: |
          FILE="solutions/${{ matrix.name }}/env-settings/qa.json"
          if [ -f "$FILE" ]; then
            # Inject GitHub secrets and variables into the settings file.
            # Add one export line per placeholder (${PLACEHOLDER}) used in the file.
            # Example: export MY_API_KEY="${{ secrets.MY_API_KEY }}"
            # Example: export MY_SERVICE_URL="${{ vars.MY_SERVICE_URL }}"
            envsubst < "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
            echo "has_settings=true" >> "$GITHUB_OUTPUT"
            echo "settings_file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_settings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import ${{ matrix.name }} to QA
        if: steps.settings.outputs.has_settings == 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true
          deployment-settings-file: ${{ steps.settings.outputs.settings_file }}

      - name: Import ${{ matrix.name }} to QA
        if: steps.settings.outputs.has_settings != 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prep:
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    needs:
      - build-matrix
      - generate-version
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
    runs-on: ubuntu-latest
    environment: prep

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: out

      - name: Prepare deployment settings for ${{ matrix.name }}
        id: settings
        shell: bash
        run: |
          FILE="solutions/${{ matrix.name }}/env-settings/prep.json"
          if [ -f "$FILE" ]; then
            # Inject GitHub secrets and variables into the settings file.
            # Add one export line per placeholder (${PLACEHOLDER}) used in the file.
            # Example: export MY_API_KEY="${{ secrets.MY_API_KEY }}"
            # Example: export MY_SERVICE_URL="${{ vars.MY_SERVICE_URL }}"
            envsubst < "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
            echo "has_settings=true" >> "$GITHUB_OUTPUT"
            echo "settings_file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_settings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import ${{ matrix.name }} to PREP
        if: steps.settings.outputs.has_settings == 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PREP_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true
          deployment-settings-file: ${{ steps.settings.outputs.settings_file }}

      - name: Import ${{ matrix.name }} to PREP
        if: steps.settings.outputs.has_settings != 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PREP_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prod:
    if: ${{ needs.build-matrix.outputs.any_changed == 'true' }}
    needs:
      - build-matrix
      - generate-version
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
      - deploy-prep
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.generate-version.outputs.version }}
          path: out

      - name: Prepare deployment settings for ${{ matrix.name }}
        id: settings
        shell: bash
        run: |
          FILE="solutions/${{ matrix.name }}/env-settings/prod.json"
          if [ -f "$FILE" ]; then
            # Inject GitHub secrets and variables into the settings file.
            # Add one export line per placeholder (${PLACEHOLDER}) used in the file.
            # Example: export MY_API_KEY="${{ secrets.MY_API_KEY }}"
            # Example: export MY_SERVICE_URL="${{ vars.MY_SERVICE_URL }}"
            envsubst < "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
            echo "has_settings=true" >> "$GITHUB_OUTPUT"
            echo "settings_file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_settings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import ${{ matrix.name }} to PROD
        if: steps.settings.outputs.has_settings == 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PROD_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true
          deployment-settings-file: ${{ steps.settings.outputs.settings_file }}

      - name: Import ${{ matrix.name }} to PROD
        if: steps.settings.outputs.has_settings != 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PROD_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.generate-version.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true