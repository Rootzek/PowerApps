name: single-run-promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (ex: 2026-01-01-v1)"
        required: true
        default: "2026-01-01-v1"
      deploy_dev:
        description: "Promote to DEV"
        required: true
        type: boolean
        default: true
      deploy_qa:
        description: "Promote to QA"
        required: true
        type: boolean
        default: true
      deploy_prep:
        description: "Promote to PREP after QA"
        required: true
        type: boolean
        default: true
      deploy_prod:
        description: "Promote to PROD after PREP"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install yq + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install yq

      - name: Read and sort release manifest
        id: manifest
        shell: bash
        run: |
          FILE="manifests/releases/current.yml"
          MATRIX_JSON=$(yq '.solutions' "$FILE" | jq -c '{include: sort_by(.order)}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  build-artifacts:
    needs: build-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Validate folder exists
        shell: bash
        run: |
          test -d "solutions/${{ matrix.name }}/src" || {
            echo "Folder not found: solutions/${{ matrix.name }}/src"
            exit 1
          }

      - name: Set solution version
        run: |
          pac solution version \
            --solution-folder solutions/${{ matrix.name }}/src \
            --strategy Solution

      - name: Pack ${{ matrix.name }} as managed
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          solution-type: Managed

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ inputs.version }}
          path: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          if-no-files-found: error

  create-release-tag:
    needs:
      - build-matrix
      - build-artifacts
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push Git tag if missing
        id: tag
        shell: bash
        run: |
          TAG="v${{ inputs.version }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi

          if git ls-remote --tags origin "refs/tags/$TAG" | grep "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub release if missing
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-dev:
    if: ${{ inputs.deploy_dev }}
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ inputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to DEV
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-qa:
    if: ${{ inputs.deploy_qa }}
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ inputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prep:
    if: ${{ inputs.deploy_prep }}
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
    runs-on: ubuntu-latest
    environment: prep

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ inputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to PREP
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PREP_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prod:
    if: ${{ inputs.deploy_prod }}
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
      - deploy-prep
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ inputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to PROD
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PROD_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ inputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true