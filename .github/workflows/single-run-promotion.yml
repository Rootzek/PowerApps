name: single-run-promotion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install yq + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install yq

      - name: Read and sort release manifest
        id: manifest
        shell: bash
        run: |
          FILE="manifests/releases/current.yml"
          MATRIX_JSON=$(yq '.solutions' "$FILE" | jq -c '{include: sort_by(.order)}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  build-artifacts:
    needs: build-matrix
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.solution_version.outputs.version }}

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Detect changes for ${{ matrix.name }}
        id: detect_changes
        shell: bash
        run: |
          echo "Checking changes for solution: ${{ matrix.name }}"

          if git diff --quiet origin/main HEAD -- solutions/${{ matrix.name }}/src; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate folder exists
        shell: bash
        run: |
          test -d "solutions/${{ matrix.name }}/src" || {
            echo "Folder not found: solutions/${{ matrix.name }}/src"
            exit 1
          }

      - name: Generate dynamic version
        id: version
        shell: bash
        run: |
          YEAR=$(date +'%Y')
          DAY_OF_YEAR=$(date +'%j')

          echo "Year: $YEAR"
          echo "Day of year: $DAY_OF_YEAR"

          # Remove leading zeros (001 → 1)
          DAY_OF_YEAR=$((10#$DAY_OF_YEAR))

          # Get today's releases
          TAG_PREFIX="v$YEAR.$DAY_OF_YEAR."

          TAGS=$(git tag | grep "^$TAG_PREFIX" || true)

          if [ -z "$TAGS" ]; then
            RELEASE=1
          else
            MAX=$(echo "$TAGS" | sed -E "s/v$YEAR\.$DAY_OF_YEAR\.([0-9]+)\..*/\1/" | sort -n | tail -n 1)
            RELEASE=$((MAX + 1))
          fi

          HOTFIX=0

          VERSION="$YEAR.$DAY_OF_YEAR.$RELEASE.$HOTFIX"

          echo "Generated version: $VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "day=$DAY_OF_YEAR" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "hotfix=$HOTFIX" >> $GITHUB_OUTPUT

      - name: Determine version for ${{ matrix.name }}
        id: solution_version
        shell: bash
        run: |
          echo "Checking if solution changed..."

          if git diff --quiet HEAD^ HEAD -- solutions/${{ matrix.name }}/src; then
            echo "No changes detected"

            LAST_COMMIT=$(git log -n 1 --pretty=format:%H -- solutions/${{ matrix.name }}/src)
            LAST_TAG=$(git tag --contains $LAST_COMMIT | head -n 1)

            if [ -z "$LAST_TAG" ]; then
              echo "No previous tag found, defaulting to generated version"
              VERSION="${{ steps.version.outputs.version }}"
            elif [[ "$LAST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
              echo "Reusing version $VERSION from tag $LAST_TAG"
            else
              echo "Previous tag $LAST_TAG has invalid format, defaulting to generated version"
              VERSION="${{ steps.version.outputs.version }}"
            fi
          else
            echo "Changes detected"
            VERSION="${{ steps.version.outputs.version }}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION" >&2
            exit 1
          fi

          IFS='.' read -r YEAR DAY RELEASE HOTFIX <<< "$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "hotfix=$HOTFIX" >> $GITHUB_OUTPUT

      - name: Set full solution version
        shell: bash
        run: |
          VERSION="${{ steps.solution_version.outputs.year }}.${{ steps.solution_version.outputs.day }}.${{ steps.solution_version.outputs.release }}.${{ steps.solution_version.outputs.hotfix }}"

          echo "Setting solution version to $VERSION"

          sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" solutions/${{ matrix.name }}/src/Other/Solution.xml

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack ${{ matrix.name }} as managed
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}_${{ steps.solution_version.outputs.version }}_managed.zip
          solution-type: Managed

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ steps.solution_version.outputs.version }}
          path: out/${{ matrix.name }}_${{ steps.solution_version.outputs.version }}_managed.zip
          if-no-files-found: error

  create-release-tag:
    needs:
      - build-matrix
      - build-artifacts
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push Git tag if missing
        id: tag
        shell: bash
        run: |
          TAG="${{ needs.build-artifacts.outputs.version }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi

          if git ls-remote --tags origin "refs/tags/$TAG" | grep "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub release if missing
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-artifacts.outputs.version }}
          name: Release v${{ needs.build-artifacts.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-dev:
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.build-artifacts.outputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to DEV
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-qa:
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.build-artifacts.outputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prep:
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
    runs-on: ubuntu-latest
    environment: prep

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.build-artifacts.outputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to PREP
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PREP_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true

  deploy-prod:
    needs:
      - build-matrix
      - build-artifacts
      - create-release-tag
      - deploy-dev
      - deploy-qa
      - deploy-prep
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download artifact for ${{ matrix.name }}
        uses: actions/download-artifact@v7
        with:
          name: managed-${{ matrix.name }}-${{ needs.build-artifacts.outputs.version }}
          path: out

      - name: Import ${{ matrix.name }} to PROD
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PROD_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_${{ needs.build-artifacts.outputs.version }}_managed.zip
          force-overwrite: true
          publish-changes: true