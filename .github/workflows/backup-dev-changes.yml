name: backup-dev-changes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Dev environment key (format: dev_<slug>, e.g. dev_user1, dev_user3). Requires matching DEV_<SLUG>_ENV_URL / DEV_<SLUG>_ENV_ID variables and a GitHub Environment of the same name.'
        required: true
        type: string
      solutions:
        description: 'Comma-separated solution names to export as a safety backup (e.g. MainSolution,SurveysSolution)'
        required: true
        type: string
      backup_label:
        description: 'Optional label to append to the backup artifact name'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build solution matrix
        id: build
        shell: bash
        run: |
          chmod +x .github/scripts/build-solution-matrix.sh
          MATRIX_JSON=$(.github/scripts/build-solution-matrix.sh "${{ inputs.solutions }}")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  backup-solutions:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve dev environment prefix
        id: env-prefix
        uses: ./.github/actions/resolve-dev-environment
        with:
          environment: ${{ inputs.environment }}

      - name: Set environment variables
        id: set-env
        shell: bash
        env:
          ENV_URL: ${{ vars[format('{0}_ENV_URL', steps.env-prefix.outputs.prefix)] }}
          ENV_ID: ${{ vars[format('{0}_ENV_ID', steps.env-prefix.outputs.prefix)] }}
        run: |
          if [ -z "$ENV_URL" ] || [ -z "$ENV_ID" ]; then
            echo "::error::Missing repository/environment variables for dev environment '${{ inputs.environment }}'. Expected '${{ steps.env-prefix.outputs.prefix }}_ENV_URL' and '${{ steps.env-prefix.outputs.prefix }}_ENV_ID' to be defined."
            exit 1
          fi
          echo "env_url=$ENV_URL" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export ${{ matrix.name }} unmanaged solution backup
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}.zip
          managed: false

      - name: Export ${{ matrix.name }} managed solution backup
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.set-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ matrix.name }}
          solution-output-file: out/${{ matrix.name }}_managed.zip
          managed: true

      - name: Build backup artifact name
        id: artifact
        shell: bash
        run: |
          SAFE_LABEL=$(printf '%s' "${{ inputs.backup_label }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -n "$SAFE_LABEL" ]; then
            ARTIFACT_NAME="backup-${{ inputs.environment }}-${{ matrix.name }}-$SAFE_LABEL"
          else
            ARTIFACT_NAME="backup-${{ inputs.environment }}-${{ matrix.name }}-${GITHUB_RUN_ID}"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            out/${{ matrix.name }}.zip
            out/${{ matrix.name }}_managed.zip
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          echo "## Backup Complete ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dev Environment:** ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment URL:** ${{ steps.set-env.outputs.env_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Solution:** ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** ${{ steps.artifact.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Use Case:** Save maker changes before resetting a stale environment." >> "$GITHUB_STEP_SUMMARY"