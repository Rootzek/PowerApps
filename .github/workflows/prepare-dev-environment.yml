name: prepare-dev-environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target dev environment to prepare'
        required: true
        type: choice
        options:
          - dev_user1
          - dev_user2
      branch_name:
        description: 'Feature branch name to create'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install yq

      - name: Read and sort release manifest
        id: manifest
        shell: bash
        run: |
          FILE="manifests/releases/current.yml"
          MATRIX_JSON=$(yq '.solutions' "$FILE" | jq -c '{include: sort_by(.order)}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  prepare-env:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      env_url: ${{ steps.set-env.outputs.env_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate branch does not exist
        shell: bash
        run: |
          if git rev-parse "origin/${{ inputs.branch_name }}" >/dev/null 2>&1; then
            echo "Error: Branch '${{ inputs.branch_name }}' already exists on origin"
            exit 1
          fi
          if git rev-parse "${{ inputs.branch_name }}" >/dev/null 2>&1; then
            echo "Error: Branch '${{ inputs.branch_name }}' already exists locally"
            exit 1
          fi
          echo "Branch '${{ inputs.branch_name }}' is available"

      - name: Set environment variables
        id: set-env
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" == "dev_user1" ]; then
            ENV_URL="${{ vars.DEV_USER1_ENV_URL }}"
          elif [ "${{ inputs.environment }}" == "dev_user2" ]; then
            ENV_URL="${{ vars.DEV_USER2_ENV_URL }}"
          fi
          echo "env_url=$ENV_URL" >> $GITHUB_OUTPUT
          echo "Using $ENV_URL"

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Power Platform
        shell: bash
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" auth create \
            --environment "${{ steps.set-env.outputs.env_url }}" \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Reset environment
        shell: bash
        run: |
          echo "Resetting environment: ${{ steps.set-env.outputs.env_url }}"
          "$POWERPLATFORMTOOLS_PACPATH" admin reset \
            --environment "${{ steps.set-env.outputs.env_url }}"

  pack-solutions:
    needs:
      - build-matrix
      - prepare-env
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate folder exists
        shell: bash
        run: |
          test -d "solutions/${{ matrix.name }}/src" || {
            echo "Folder not found: solutions/${{ matrix.name }}/src"
            exit 1
          }

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack ${{ matrix.name }} as unmanaged
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}_unmanaged.zip
          solution-type: Unmanaged

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: solution-${{ matrix.name }}
          path: out/${{ matrix.name }}_unmanaged.zip
          if-no-files-found: error

  import-solutions:
    needs:
      - build-matrix
      - prepare-env
      - pack-solutions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download ${{ matrix.name }} artifact
        uses: actions/download-artifact@v7
        with:
          name: solution-${{ matrix.name }}
          path: out

      - name: Import ${{ matrix.name }} to ${{ inputs.environment }}
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ needs.prepare-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_unmanaged.zip
          force-overwrite: true
          publish-changes: true

  create-feature-branch:
    needs:
      - prepare-env
      - import-solutions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create and push feature branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b "${{ inputs.branch_name }}"
          git push origin "${{ inputs.branch_name }}"

      - name: Output summary
        shell: bash
        run: |
          echo "## Environment Preparation Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.prepare-env.outputs.env_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Created:** ${{ inputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance Reset:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Solutions Imported:** ✅" >> $GITHUB_STEP_SUMMARY
