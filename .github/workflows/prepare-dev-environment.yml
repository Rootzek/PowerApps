name: prepare-dev-environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target dev environment to prepare'
        required: true
        type: choice
        options:
          - dev_user1
          - dev_user2
      branch_name:
        description: 'Feature branch name to create. The actual branch will be created as <environment>/<branch_name> if not already prefixed.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install yq

      - name: Read and sort release manifest
        id: manifest
        shell: bash
        run: |
          FILE="manifests/releases/current.yml"
          MATRIX_JSON=$(yq '.solutions' "$FILE" | jq -c '{include: sort_by(.order)}')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX_JSON"

  prepare-env:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      env_url: ${{ steps.set-env.outputs.env_url }}
      env_id: ${{ steps.set-env.outputs.env_id }}
      branch_name: ${{ steps.validate-branch.outputs.branch_name }}
      source_sha: ${{ steps.capture-source.outputs.source_sha }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate branch does not exist
        id: validate-branch
        shell: bash
        run: |
          git fetch --prune origin +refs/heads/*:refs/remotes/origin/*

          if [[ "${{ inputs.branch_name }}" == "${{ inputs.environment }}/*" ]]; then
            FULL_BRANCH_NAME="${{ inputs.branch_name }}"
          else
            FULL_BRANCH_NAME="${{ inputs.environment }}/${{ inputs.branch_name }}"
          fi

          if git rev-parse --verify "origin/${FULL_BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Error: Branch '${FULL_BRANCH_NAME}' already exists on origin"
            exit 1
          fi

          if git rev-parse --verify "${FULL_BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Error: Branch '${FULL_BRANCH_NAME}' already exists locally"
            exit 1
          fi

          if git branch -r --list "origin/${{ inputs.environment }}" | grep -q . || \
             git branch -r --list "origin/${{ inputs.environment }}/*" | grep -q .; then
            echo "Error: Dev environment '${{ inputs.environment }}' is already in use by an existing branch"
            exit 1
          fi

          echo "Branch '${FULL_BRANCH_NAME}' is available"
          echo "branch_name=${FULL_BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Capture source revision
        id: capture-source
        shell: bash
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Preparing environment from main at $SOURCE_SHA"

      - name: Set environment variables
        id: set-env
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" == "dev_user1" ]; then
            ENV_URL="${{ vars.DEV_USER1_ENV_URL }}"
            ENV_ID="${{ vars.DEV_USER1_ENV_ID }}"
          elif [ "${{ inputs.environment }}" == "dev_user2" ]; then
            ENV_URL="${{ vars.DEV_USER2_ENV_URL }}"
            ENV_ID="${{ vars.DEV_USER2_ENV_ID }}"
          fi
          echo "env_url=$ENV_URL" >> $GITHUB_OUTPUT
          echo "env_id=$ENV_ID" >> $GITHUB_OUTPUT
          echo "Using $ENV_URL"

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Power Platform
        shell: bash
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" auth create \
            --environment "${{ steps.set-env.outputs.env_url }}" \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Reset environment
        shell: bash
        run: |
          echo "Resetting environment: ${{ steps.set-env.outputs.env_url }}"
          "$POWERPLATFORMTOOLS_PACPATH" admin reset \
            --environment "${{ steps.set-env.outputs.env_url }}"

  pack-solutions:
    needs:
      - build-matrix
      - prepare-env
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate folder exists
        shell: bash
        run: |
          test -d "solutions/${{ matrix.name }}/src" || {
            echo "Folder not found: solutions/${{ matrix.name }}/src"
            exit 1
          }

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack ${{ matrix.name }} as unmanaged
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ matrix.name }}/src
          solution-file: out/${{ matrix.name }}_unmanaged.zip
          solution-type: Unmanaged

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: solution-${{ matrix.name }}
          path: out/${{ matrix.name }}_unmanaged.zip
          if-no-files-found: error

  import-solutions:
    needs:
      - build-matrix
      - prepare-env
      - pack-solutions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download ${{ matrix.name }} artifact
        uses: actions/download-artifact@v7
        with:
          name: solution-${{ matrix.name }}
          path: out

      - name: Import ${{ matrix.name }} to ${{ inputs.environment }}
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ needs.prepare-env.outputs.env_url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/${{ matrix.name }}_unmanaged.zip
          force-overwrite: true
          publish-changes: true

  stamp-environment:
    needs:
      - prepare-env
      - import-solutions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Stamp environment preparation metadata
        shell: bash
        env:
          ENV_URL: ${{ needs.prepare-env.outputs.env_url }}
          BRANCH_NAME: ${{ needs.prepare-env.outputs.branch_name }}
          SOURCE_SHA: ${{ needs.prepare-env.outputs.source_sha }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
        run: |
          set -euo pipefail

          get_json_value() {
            local key="$1"
            local payload="$2"
            python -c "import json, sys; data = json.loads(sys.argv[2]); value = data.get(sys.argv[1], ''); print('' if value is None else value)" "$key" "$payload"
          }

          url_encode() {
            python -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          first_value_field() {
            local payload="$1"
            local field_name="$2"
            python -c "import json, sys; data = json.loads(sys.argv[1]); rows = data.get('value', []); print(rows[0].get(sys.argv[2], '') if rows else '')" "$payload" "$field_name"
          }

          build_definition_payload() {
            local schema_name="$1"
            local display_name="$2"
            local description="$3"
            python -c "import json, sys; print(json.dumps({'schemaname': sys.argv[1], 'displayname': sys.argv[2], 'description': sys.argv[3], 'type': 100000000, 'defaultvalue': ''}))" "$schema_name" "$display_name" "$description"
          }

          build_value_create_payload() {
            local schema_name="$1"
            local current_value="$2"
            local definition_id="$3"
            python -c "import json, sys; print(json.dumps({'schemaname': sys.argv[1], 'value': sys.argv[2], 'EnvironmentVariableDefinitionId@odata.bind': f'/environmentvariabledefinitions({sys.argv[3]})'}))" "$schema_name" "$current_value" "$definition_id"
          }

          build_value_update_payload() {
            local current_value="$1"
            python -c "import json, sys; print(json.dumps({'value': sys.argv[1]}))" "$current_value"
          }

          request_oidc_token() {
            local response
            response=$(curl -fsSL \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")
            get_json_value value "$response"
          }

          request_dataverse_token() {
            local oidc_token="$1"
            local response
            response=$(curl -fsSL -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=$CLIENT_ID" \
              --data-urlencode "scope=${ENV_URL%/}/.default" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion=$oidc_token")
            get_json_value access_token "$response"
          }

          upsert_environment_variable() {
            local schema_name="$1"
            local display_name="$2"
            local description="$3"
            local current_value="$4"
            local definition_filter
            local definition_response
            local definition_id
            local value_filter
            local value_response
            local value_id
            local payload

            definition_filter=$(url_encode "schemaname eq '$schema_name'")
            definition_response=$(curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "$API_URL/environmentvariabledefinitions?\$select=environmentvariabledefinitionid&\$filter=$definition_filter")

            definition_id=$(first_value_field "$definition_response" "environmentvariabledefinitionid")

            if [ -z "$definition_id" ]; then
              payload=$(build_definition_payload "$schema_name" "$display_name" "$description")

              definition_response=$(curl -fsSL -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=representation" \
                -d "$payload" \
                "$API_URL/environmentvariabledefinitions")

              definition_id=$(get_json_value environmentvariabledefinitionid "$definition_response")
            fi

            value_filter=$(url_encode "schemaname eq '$schema_name'")
            value_response=$(curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "$API_URL/environmentvariablevalues?\$select=environmentvariablevalueid&\$filter=$value_filter")

            value_id=$(first_value_field "$value_response" "environmentvariablevalueid")

            if [ -z "$value_id" ]; then
              payload=$(build_value_create_payload "$schema_name" "$current_value" "$definition_id")
              curl -fsSL -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$API_URL/environmentvariablevalues" >/dev/null
            else
              payload=$(build_value_update_payload "$current_value")
              curl -fsSL -X PATCH \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$API_URL/environmentvariablevalues($value_id)" >/dev/null
            fi

            echo "Stamped $schema_name"
          }

          OIDC_TOKEN=$(request_oidc_token)
          ACCESS_TOKEN=$(request_dataverse_token "$OIDC_TOKEN")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain Dataverse access token"
            exit 1
          fi

          API_URL="${ENV_URL%/}/api/data/v9.2"

          upsert_environment_variable \
            "mp_PreparedBranch" \
            "Prepared Branch" \
            "Operational marker storing the branch used to seed this dev environment." \
            "$BRANCH_NAME"

          upsert_environment_variable \
            "mp_PreparedSourceSha" \
            "Prepared Source SHA" \
            "Operational marker storing the Git commit used to seed this dev environment." \
            "$SOURCE_SHA"

  create-feature-branch:
    needs:
      - prepare-env
      - import-solutions
      - stamp-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-env.outputs.source_sha }}
          fetch-depth: 0

      - name: Create and push feature branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BRANCH_NAME="${{ needs.prepare-env.outputs.branch_name }}"
          if [ -z "$BRANCH_NAME" ]; then
            echo "Error: computed branch name is empty"
            exit 1
          fi
          echo "Creating branch '$BRANCH_NAME'"
          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "Branch created and pushed: $BRANCH_NAME"
          git branch --show-current
          git ls-remote --heads origin "$BRANCH_NAME"

      - name: Output summary
        shell: bash
        run: |
          echo "## Environment Preparation Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment URL:** ${{ needs.prepare-env.outputs.env_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Created:** ${{ needs.prepare-env.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source SHA:** ${{ needs.prepare-env.outputs.source_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance Reset:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Solutions Imported:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Markers Updated:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "-- git remote update && git checkout ${{ needs.prepare-env.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "-- https://make.powerapps.com/environments/${{ needs.prepare-env.outputs.env_id }}/home" >> $GITHUB_STEP_SUMMARY
          echo "-- Do your changes directly in the solution you want to modify" >> $GITHUB_STEP_SUMMARY
          echo "-- git add . && git commit -m 'Update Message' && git push origin ${{ needs.prepare-env.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "-- Create your Pull Request and merge it" >> $GITHUB_STEP_SUMMARY
