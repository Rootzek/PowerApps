name: export-solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Nom de la solution à exporter"
        required: true
        default: "MainSolution"

permissions:
  contents: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export ${{ inputs.solution_name }} unmanaged solution from DEV
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: out/${{ inputs.solution_name }}.zip
          managed: false

      - name: Export ${{ inputs.solution_name }} managed solution from DEV
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: out/${{ inputs.solution_name }}_managed.zip
          managed: true

      - name: Unpack ${{ inputs.solution_name }} solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ inputs.solution_name }}.zip
          solution-folder: solutions/${{ inputs.solution_name }}/src
          solution-type: Both
          overwrite-files: true

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: sync ${{ inputs.solution_name }} (managed + unmanaged) from DEV" || echo "No changes to commit"
          git push
