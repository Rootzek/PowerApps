name: deploy-from-manifest

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Deploy MainSolution
      - name: Pack MainSolution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/MainSolution/src
          solution-file: out/MainSolution_managed.zip
          solution-type: Managed

      - name: Import MainSolution to QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/MainSolution_managed.zip
          force-overwrite: true
          publish-changes: true

      # Deploy SurveysSolution
      - name: Pack SurveysSolution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/SurveysSolution/src
          solution-file: out/SurveysSolution_managed.zip
          solution-type: Managed

      - name: Import SurveysSolution to QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.QA_ENV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/SurveysSolution_managed.zip
          force-overwrite: true
          publish-changes: true